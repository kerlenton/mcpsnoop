version: 2
updates:
  # The workflows and the composite action pin every action to a commit SHA, and
  # a pin nobody moves goes stale. This moves them, in one pull request a month.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
  # The client matrix measures the official Go SDK, so the column is only worth
  # reading while it is the current SDK.
  - package-ecosystem: gomod
    directory: /clientmatrix
    schedule:
      interval: monthly
    groups:
      clientmatrix:
        patterns:
          - "*"
