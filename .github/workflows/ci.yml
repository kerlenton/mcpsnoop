name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: actions/setup-node@v7
        # The npm launcher is the one file in this repo that runs on a user's
        # machine, and its tests drive it with a real node. Stated rather than
        # relying on the runner image happening to carry one.
        with:
          node-version: "22"
      - name: gofmt -s
        run: |
          out="$(gofmt -s -l .)"
          if [ -n "$out" ]; then echo "gofmt -s needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: make staticcheck
      - name: test
        # Stated rather than inherited. The runner is UTC today, `make check`
        # pins CHECK_TZ to UTC to match it, and neither should depend on the
        # other's default staying put.
        env:
          TZ: UTC
        run: go test -race ./...
      - name: build
        run: go build ./...
      # The action is shell, so nothing above compiles or runs it, and it is the
      # only part of this repository that runs in other people's workflows.
      - name: action
        run: make action-test

  # Keep the Windows and macOS binaries honest. The release ships both, but the
  # gate above only runs on Linux. macOS is Unix-like, so it runs the full race
  # suite. Windows runs vet and build to catch the platform-tagged code (the
  # console shim, socket paths) compiling, without depending on the exec-based
  # test helpers being portable.
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            check: go test -race ./...
          - os: windows-latest
            check: go vet ./...
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: check
        env:
          TZ: UTC
        run: ${{ matrix.check }}
      - name: build
        run: go build ./...
