# GoReleaser v2, on a pushed tag it cross-compiles the binaries, builds the
# archives and checksums, and publishes a GitHub Release with a generated
# changelog. Run locally with goreleaser release --snapshot --clean
version: 2

project_name: mcpsnoop

before:
  hooks:
    - go mod tidy

builds:
  - id: mcpsnoop
    main: ./cmd/mcpsnoop
    binary: mcpsnoop
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

# Without this, a v*-rc tag publishes as an ordinary release and takes the Latest
# badge, because prerelease defaults to false and GitHub's own make_latest
# default is true. The npm half already keeps a prerelease off the `latest`
# dist-tag, and this is the other half of the same promise. Detection is on the
# semver prerelease field, not a substring, so any hyphenated tag is caught.
release:
  prerelease: auto

git:
  # Tells git's version sort that -rc marks a prerelease. Without it,
  # `git tag --points-at HEAD --sort -version:refname` puts v0.20.1-rc.1 above
  # v0.20.1, so promoting a release candidate by tagging the same commit makes
  # GoReleaser rebuild the rc and leaves the npm job downloading a release that
  # was never created.
  prerelease_suffix: "-rc"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Use GitHub's own release-notes generator, so each entry is the PR title, linked,
# credited to its author (by @user in #N), instead of a raw commit + email dump.
changelog:
  use: github-native
